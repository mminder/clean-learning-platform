server:
  servlet:
    session:
      # The login's session (D-25). Secure comes with production (MVP); see _docs/architecture/security.md.
      cookie:
        http-only: true
        same-site: lax
spring:
  application:
    name: clean-learning-platform
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      # A whole-number field answers 400 for a decimal, instead of cutting 45.5 to 45 and saving it.
      accept-float-as-int: false
  web:
    # The UI is English only (D-20): validation messages ignore the browser's Accept-Language.
    locale: en
    locale-resolver: fixed
springdoc:
  # The committed backend/openapi.json must not change unless the API does: pretty-printed, keys sorted.
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  model-converters:
    # A response field annotated with @Nullable is nullable, and so not required (RequiredResponseFieldsCustomizer).
    java-nullable-property-customizer:
      enabled: true
